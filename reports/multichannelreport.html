<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why CatholicAdNet Web Display Should Work Alongside Facebook</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf2f8}iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="reportFrame" src="./multichannelreport-base.html" title="CatholicAdNet multichannel report"></iframe>
<script>
const frame=document.getElementById('reportFrame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const baseConv=doc&&doc.getElementById('baseConv');
  const convLift=doc&&doc.getElementById('convLift');
  if(!baseConv||!convLift)return;
  let integratedConv=doc.getElementById('integratedConv');
  if(!integratedConv){
    const field=doc.createElement('div');
    field.className='field';
    field.innerHTML='<label for="integratedConv">Calculated monthly conversions from integrated approach</label><input id="integratedConv" type="number" value="256" readonly aria-readonly="true"><div class="field-note">Calculated automatically from Facebook-only conversions × the incremental conversion lift.</div>';
    baseConv.closest('.field').insertAdjacentElement('afterend',field);
    integratedConv=doc.getElementById('integratedConv');
  }
  const updateIntegratedConversions=()=>{
    const baseline=Number(baseConv.value)||0;
    const lift=Number(convLift.value)||0;
    integratedConv.value=Math.round(baseline*(1+lift/100));
  };
  baseConv.addEventListener('input',updateIntegratedConversions);
  convLift.addEventListener('input',updateIntegratedConversions);
  updateIntegratedConversions();
});
</script>
</body>
</html>

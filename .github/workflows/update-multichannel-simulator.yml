name: Update multichannel report simulator

on:
  push:
    paths:
      - .github/workflows/update-multichannel-simulator.yml

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update simulator fields and calculations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('reports/multichannelreport.html')
          text = path.read_text(encoding='utf-8')

          # Add a clear read-only style for the calculated CatholicAdNet spend field.
          css_old = ".field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}"
          css_new = css_old + ".field input[readonly]{background:#eef3f9;color:var(--navy);font-weight:850;cursor:not-allowed}.field-note{margin-top:5px;font-size:11px;color:var(--muted)}"
          if css_old not in text:
              raise SystemExit('Expected simulator input CSS was not found.')
          text = text.replace(css_old, css_new, 1)

          old_sim = '''<div class="sim"><div class="panel"><div class="field"><label>Current monthly acquisition spend ($)</label><input id="baseSpend" type="number" min="1" value="10000"></div><div class="field"><label>Current monthly conversions</label><input id="baseConv" type="number" min="1" value="200"></div><div class="field"><label>Additional media spend</label><div class="range"><input id="spendLift" type="range" min="0" max="100" value="20"><output id="spendOut">20%</output></div></div><div class="field"><label>Incremental conversion lift</label><div class="range"><input id="convLift" type="range" min="0" max="100" value="28"><output id="convOut">28%</output></div></div></div>
<div class="panel"><div class="results"><div class="result"><div class="v" id="baseCPA">$50.00</div><div class="l">Current blended CPA</div></div><div class="result"><div class="v" id="newCPA">$46.88</div><div class="l">New blended CPA</div></div><div class="result"><div class="v" id="change">-6.3%</div><div class="l">CPA change</div></div></div><div class="callout"><strong>Break-even rule:</strong> If spend rises 15%, conversions must rise at least 15% to keep blended CPA flat. A conversion lift above 15% lowers blended CPA.</div><div class="formula" id="formula"></div><p style="font-size:12px;color:var(--muted)">This is an economic illustration, not an attribution model or a performance forecast.</p></div></div>'''

          new_sim = '''<div class="sim"><div class="panel"><div class="field"><label>Current monthly Facebook spend ($)</label><input id="facebookSpend" type="number" min="1" value="10000"></div><div class="field"><label>Calculated monthly CatholicAdNet spend ($)</label><input id="catholicAdNetSpend" type="number" value="2000" readonly aria-readonly="true"><div class="field-note">Calculated automatically from Facebook spend × the additional ad spend percentage below.</div></div><div class="field"><label>Current monthly conversions from the Facebook-only baseline</label><input id="baseConv" type="number" min="1" value="200"></div><div class="field"><label>Additional ad spend for CatholicAdNet (%)</label><div class="range"><input id="spendLift" type="range" min="0" max="100" value="20"><output id="spendOut">20%</output></div></div><div class="field"><label>Incremental conversion lift from the combined approach (%)</label><div class="range"><input id="convLift" type="range" min="0" max="100" value="28"><output id="convOut">28%</output></div></div></div>
<div class="panel"><div class="results"><div class="result"><div class="v" id="baseCPA">$50.00</div><div class="l">Facebook-only CPA</div></div><div class="result"><div class="v" id="newCPA">$46.88</div><div class="l">Combined Facebook + CatholicAdNet CPA</div></div><div class="result"><div class="v" id="change">-6.3%</div><div class="l">CPA change</div></div></div><div class="callout"><strong>Break-even rule:</strong> The additional conversion lift must at least equal the CatholicAdNet spend as a percentage of Facebook spend to keep CPA flat. A higher conversion lift lowers CPA.</div><div class="formula" id="formula"></div><p style="font-size:12px;color:var(--muted)">This is an economic illustration, not an attribution model or a performance forecast.</p></div></div>'''

          if old_sim not in text:
              raise SystemExit('Expected simulator HTML block was not found.')
          text = text.replace(old_sim, new_sim, 1)

          old_calc_pattern = re.compile(
              r"function calc\(\)\{const spend=\+baseSpend\.value\|\|0,conv=\+baseConv\.value\|\|1,sl=\+spendLift\.value,cl=\+convLift\.value;.*?\}\[baseSpend,baseConv,spendLift,convLift\]\.forEach\(x=>x\.addEventListener\('input',calc\)\);calc\(\);",
              re.S,
          )
          new_calc = """function calc(){const facebook=+facebookSpend.value||0,conv=+baseConv.value||1,sl=+spendLift.value,cl=+convLift.value;spendOut.value=sl+'%';convOut.value=cl+'%';const canSpend=facebook*(sl/100),totalSpend=facebook+canSpend,old=facebook/conv,newConv=conv*(1+cl/100),now=totalSpend/newConv,delta=(now/old-1)*100;catholicAdNetSpend.value=Math.round(canSpend);baseCPA.textContent='$'+old.toFixed(2);newCPA.textContent='$'+now.toFixed(2);change.textContent=(delta>0?'+':'')+delta.toFixed(1)+'%';change.style.color=delta<=0?'#18723a':'#b02b2b';formula.textContent=`Facebook-only CPA = $${facebook.toLocaleString()} ÷ ${conv.toLocaleString()} = $${old.toFixed(2)}\\nCatholicAdNet spend = $${facebook.toLocaleString()} × ${sl}% = $${canSpend.toLocaleString(undefined,{maximumFractionDigits:0})}\\nCombined CPA = $${totalSpend.toLocaleString(undefined,{maximumFractionDigits:0})} ÷ ${newConv.toLocaleString(undefined,{maximumFractionDigits:0})} = $${now.toFixed(2)}`}[facebookSpend,baseConv,spendLift,convLift].forEach(x=>x.addEventListener('input',calc));calc();"""

          text, count = old_calc_pattern.subn(new_calc, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one calculator function replacement; found {count}.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit report update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/multichannelreport.html
          git commit -m "Separate Facebook and CatholicAdNet spend in CPA simulator"
          git push
